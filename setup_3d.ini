# KoMPoST3D.exe setup (src/Main3D.cpp). tIn and the grid come from the TMUNU3D input file,
# so [KoMPoSTInputs] tIn/InputFile/OutputFileTag and [EventInput] are not used.
[KoMPoSTInputs]
tOut = 1.2

[KoMPoSTParameters]
EtaOverS = 0.16
EtaOverSTemperatureScale = 0.1

# 0 for free-streaming, 1 for "KoMPoST" EKT evolution
EVOLUTION_MODE=1

# 0 or 1
ENERGY_PERTURBATIONS=1

# 0 or 1
MOMENTUM_PERTURBATIONS=1

# TwoPass (default), KoMPoSTAddition or NoRegulator
Regulator=TwoPass
